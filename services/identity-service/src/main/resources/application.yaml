spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://localhost:5432/identity_service_db
    username: identity_service_user
    password: ${IDENTITY_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

server:
  port: 8081

jwt:
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem
  access-token-expiration: 900

security:
  activation-token:
    expiration: 24h
    resend-window: 24h
    max-emails-per-window: 3

  refresh-token:
    expiration: 30d
    absolute-session-lifetime: 90d
    cookie-name: edusphere_refresh
    cookie-path: /api/v1/auth
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: Strict

  password-reset-token:
    expiration: 1h
    request-window: 24h
    max-emails-per-window: 3
    reset-window: 24h
    max-resets-per-window: 1
  login-lockout:
    first-failure-threshold: 5
    escalated-failure-threshold: 3
    first-lock-duration: 30m
    second-lock-duration: 30d
    final-lock-duration: 365d
    locked-message-prefix: "Account is locked until "
    locked-message-suffix: ". Please contact an admin to unlock sooner."

app:
  activation:
    base-url: ${ACTIVATION_BASE_URL:http://localhost:5173/activate}
    from-address: ${ACTIVATION_EMAIL_FROM:no-reply@edusphere.com}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
    from-address: ${PASSWORD_RESET_EMAIL_FROM:${ACTIVATION_EMAIL_FROM:no-reply@edusphere.com}}
